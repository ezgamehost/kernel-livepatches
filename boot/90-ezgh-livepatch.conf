# ezgh-livepatch-boot: keep EZGH livepatch modules out of dracut initramfs images.
# dracut strips the modules it copies, which turns a livepatch's .klp.rela sections into
# sections the kernel ignores: the patch then loads without its relocations and faults on
# first use (gp1, 2026-10-29). They load from the root filesystem instead, unstripped.
# Each entry is an anchored regex on the module name; no glob characters (dracut runs with
# nullglob, which would drop the entry).
omit_drivers+=" livepatch_.+ "
add_dracutmodules+=" ezgh-livepatch "
